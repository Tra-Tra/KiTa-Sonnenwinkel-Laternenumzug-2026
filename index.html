<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Kita Sonnenwinkel | Laternenumzug 2026</title>

<style>

:root{
 --bg1:#34265f;
 --bg2:#51428b;
 --gold:#ffd76a;
 --orange:#ff9d3f;
 --red:#ff6d43;
 --paper:#fffaf0;
 --text:#40345d;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,
body{
 width:100%;
 height:100%;
 font-family:
 "Trebuchet MS",
 "Arial Rounded MT Bold",
 "Segoe UI",
 Arial,
 sans-serif;
 overflow:hidden;
}

body{
 background:
 radial-gradient(
  circle at top,
  #7561ad 0%,
  var(--bg2) 55%,
  var(--bg1) 100%);
 color:white;
}

#sky{
 position:fixed;
 inset:0;
 overflow:hidden;
 pointer-events:none;
 z-index:1;
}

#sky{
 background-image:
  radial-gradient(circle, #fff2bd 2px, transparent 3px),
  radial-gradient(circle, #d9c9ff 1px, transparent 2px);
 background-size:110px 130px, 71px 97px;
 background-position:18px 30px, 48px 65px;
}

#sky::after{
 content:"";
 position:absolute;
 bottom:-65px;
 left:-10%;
 width:120%;
 height:160px;
 border-radius:50% 50% 0 0;
 background:#547878;
 box-shadow:100px -18px 0 #668780;
}

.app{
 position:relative;
 z-index:2;
 height:100vh;
 height:100dvh;
 max-width:860px;
 margin:0 auto;
 padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
  env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
 display:flex;
 flex-direction:column;
}

header{
 text-align:center;
 padding:10px 12px 0;
}

header h1{
 color:#fff1c8;
 font-size:clamp(.85rem,3vw,1rem);
 letter-spacing:.06em;
}

header p{
 margin-top:3px;
 font-size:clamp(1.5rem,6vw,2.25rem);
 font-weight:800;
 text-shadow:0 3px 0 #403166;
}

.nightFriends{
 display:block;
 width:min(100%, 420px);
 height:96px;
 margin:0 auto;
}

.lanternFriend{
 transform-box:fill-box;
 transform-origin:top center;
 animation:sway 5s ease-in-out infinite;
}

@keyframes sway{
 0%, 100%{transform:rotate(-3deg)}
 50%{transform:rotate(3deg)}
}

.songCard{

 flex:1;
 min-height:0;
 touch-action:pan-y;

 margin:0 12px 8px;

 background:var(--paper);

 color:var(--text);

 border:4px solid #e7d6ff;
 border-radius:32px 32px 26px 26px;

 overflow:auto;

 padding:16px clamp(12px,3vw,28px) 20px;

 box-shadow:0 7px 0 #2e234b, 0 12px 24px #25194240;
 scrollbar-color:#b5a0d4 var(--paper);
}

.songHeading{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 margin-bottom:10px;
}

.songBadge{
 display:grid;
 place-items:center;
 flex-shrink:0;
 width:44px;
 height:44px;
 border-radius:16px;
 background:#ffe59b;
 color:#735025;
 font-size:1.9rem;
 transform:rotate(-8deg);
}

.songTitle{
 text-align:center;
 color:#5c4086;
 font-size:clamp(1.3rem,4.6vw,2rem);
 line-height:1.2;
 text-wrap:balance;
}

.verseCounter{
 width:fit-content;
 margin:0 auto 12px;
 padding:5px 14px;
 border-radius:30px;
 background:#f0e5ff;
 color:#614583;
 font-size:.85rem;
 font-weight:700;
}

.verse{

 min-height:30vh;

 display:flex;
 align-items:center;
 justify-content:center;

 text-align:center;

 background:#fff1d2;
 border:2px dashed #d9b879;
 border-radius:24px;
 padding:18px 10px;
}

.verseText{

 white-space:pre-line;

 line-height:1.65;

 font-size:
 clamp(1.4rem,4vw,2rem);
}

.controls{
 display:grid;
 grid-template-columns:
 1fr auto 1fr;

 gap:8px;
 padding:4px 12px 10px;
}

button{
 min-width:48px;
 min-height:48px;
 border:2px solid #fff5;
 border-radius:20px;
 padding:8px;
 font:inherit;
 font-size:.9rem;
 font-weight:700;
 color:#40345d;
 background:#ffe18b;
 box-shadow:0 5px 0 #bb873f;
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
 transition:transform .15s, box-shadow .15s;
}

button:active{
 transform:translateY(4px);
 box-shadow:0 1px 0 #bb873f;
}

button:focus-visible{
 outline:3px solid white;
 outline-offset:3px;
}

.nextButton{
 background:#9ee3d0;
 box-shadow:0 5px 0 #387e72;
}

.nextButton:active{
 box-shadow:0 1px 0 #387e72;
}

.buttonArrow{
 display:block;
 font-size:1.9rem;
 line-height:1;
 margin-bottom:3px;
}

.centerButtons{
 display:flex;
 gap:6px;
 align-items:center;
 justify-content:center;
}

.centerButtons button{
 background:#eee2ff;
 box-shadow:0 5px 0 #8870ae;
 font-size:1.1rem;
}

.centerButtons button:active{
 box-shadow:0 1px 0 #8870ae;
}

.footerInfo{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:10px;
 text-align:center;
 padding:0 10px 3px;
 font-size:.8rem;
 font-weight:700;
}

.songProgress{
 display:flex;
 gap:5px;
 color:#ffe18b;
 font-size:1.4rem;
 line-height:1.2;
}

.help{
 text-align:center;
 padding:0 8px 8px;
 font-size:.75rem;
 color:#fff4d9;
}

header,
.controls,
.footerInfo,
.help{
 flex-shrink:0;
}

@media (max-height:500px){
 header{padding-top:4px}
 header p{font-size:1.3rem}
 .nightFriends{height:44px}
 .songCard{padding-top:10px}
 .buttonArrow{display:inline; font-size:1.2rem; margin-right:4px}
 .help{padding-bottom:4px}
}

@media (prefers-reduced-motion:reduce){
 .lanternFriend{
  animation:none;
 }
 button{transition:none}
}

</style>
</head>

<body>

<div id="sky" aria-hidden="true"></div>

<div class="app">

<header>
<h1>Kita Sonnenwinkel · Laternenumzug 2026</h1>
<p>Komm, wir leuchten!</p>
<svg class="nightFriends" viewBox="0 0 420 110" aria-hidden="true" focusable="false">
 <path d="M10 12 Q210 75 410 12" fill="none" stroke="#dac4f4" stroke-width="3" stroke-linecap="round"/>
 <g fill="#ffe59b">
  <path d="m27 48 3 8 9 1-7 6 2 9-7-5-8 5 3-9-7-6 9-1z"/>
  <path d="m283 64 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z"/>
  <circle cx="185" cy="12" r="3"/>
  <circle cx="253" cy="24" r="2"/>
 </g>
 <g>
  <path d="M367 13 A34 34 0 1 0 399 60 A29 29 0 0 1 367 13" fill="#ffe59b" stroke="#fff1bc" stroke-width="2"/>
  <path d="M353 48q4-6 8 0m-4 9q6 6 12 0" fill="none" stroke="#75543c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="348" cy="57" r="4" fill="#f3b29b"/>
 </g>
 <g class="lanternFriend">
  <path d="M87 31v13m-13 9v-6a13 10 0 0 1 26 0v6" fill="none" stroke="#f8dfaf" stroke-width="3"/>
  <rect x="61" y="52" width="52" height="48" rx="15" fill="#ffc76d" stroke="#ffe8b1" stroke-width="3"/>
  <path d="M74 56v40m26-40v40" stroke="#ec9a52" stroke-width="2"/>
  <circle cx="81" cy="73" r="2.5" fill="#62405a"/><circle cx="95" cy="73" r="2.5" fill="#62405a"/>
  <path d="M82 82q6 7 12 0" fill="none" stroke="#62405a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M77 101h20" stroke="#ffe8b1" stroke-width="4" stroke-linecap="round"/>
 </g>
 <g class="lanternFriend" style="animation-delay:-2s">
  <path d="M210 44v12m-12 9v-5a12 9 0 0 1 24 0v5" fill="none" stroke="#f8dfaf" stroke-width="3"/>
  <rect x="184" y="64" width="52" height="40" rx="14" fill="#f7aac5" stroke="#ffdae5" stroke-width="3"/>
  <path d="M197 67v33m26-33v33" stroke="#dd82ab" stroke-width="2"/>
  <path d="M199 81q3-5 6 0m10 0q3-5 6 0m-16 7q6 6 12 0" fill="none" stroke="#62405a" stroke-width="2.5" stroke-linecap="round"/>
 </g>
</svg>
</header>

<main class="songCard" aria-live="polite">

<div class="songHeading">
<span class="songBadge" aria-hidden="true">♫</span>
<h2 class="songTitle" id="songTitle"></h2>
</div>

<div class="verseCounter" id="verseCounter"></div>

<div class="verse">
<div class="verseText" id="verseText"></div>
</div>

</main>

<div class="controls">

<button type="button" onclick="previousVerse()" aria-label="Vorherige Strophe">
<span class="buttonArrow" aria-hidden="true">←</span>Zurück
</button>

<div class="centerButtons">

<button type="button" onclick="changeFont(2)" aria-label="Schrift vergrößern">
A+
</button>

<button type="button" onclick="changeFont(-2)" aria-label="Schrift verkleinern">
A-
</button>

</div>

<button class="nextButton" type="button" onclick="nextVerse()" aria-label="Nächste Strophe">
<span class="buttonArrow" aria-hidden="true">→</span>Weiter
</button>

</div>

<div class="footerInfo">
<div class="songProgress" id="songProgress" aria-hidden="true"></div>
<span id="songInfo"></span>
</div>

<div class="help">
Wischen oder tippen · Sing mit! ♫
</div>

</div>

<script>

const songs = [

{
 title:"Durch die Straßen auf und nieder",

 verses:[

`Durch die Straßen auf und nieder
leuchten die Laternen wieder:
rote, gelbe, grüne, blaue,
lieber Martin, komm und schaue!`,

`Wie die Blumen in dem Garten,
blühn Laternen aller Arten:
rote, gelbe, grüne, blaue,
lieber Martin, komm und schaue!`,

`Und wir gehen lange Strecken,
mit Laternen an den Stecken:
rote, gelbe, grüne, blaue,
lieber Martin, komm und schaue!`

 ]
},

{
 title:"Ich geh mit meiner Laterne",

 verses:[

`Ich geh mit meiner Laterne
und meine Laterne mit mir.

Da oben leuchten die Sterne,
hier unten leuchten wir.

St. Martin hier,
wir leuchten dir,

rabimmel,
rabammel,
rabumm.`,
`Ich geh mit meiner Laterne
und meine Laterne mit mir.

Da oben leuchten die Sterne,
hier unten leuchten wir.

Ein Lichtermeer
zu Martins Ehr,

rabimmel,
rabammel,
rabumm.`,

`Ich geh mit meiner Laterne
und meine Laterne mit mir.

Da oben leuchten die Sterne,
hier unten leuchten wir.

Mein Licht ist schön,
könnt ihr es sehn,

rabimmel,
rabammel,
rabumm.`

 ]
},

{
 title:"Laterne, Laterne",

 verses:[

`Laterne, Laterne,
Sonne, Mond und Sterne.

Brenne auf, mein Licht,
brenne auf, mein Licht,

aber nur meine liebe
Laterne nicht.`,

`Laterne, Laterne,
Sonne, Mond und Sterne.

Sperrt ihn ein, den Wind,
sperrt ihn ein, den Wind,

er soll warten,
bis wir alle zu Hause sind!`

 ]
}

];

let songIndex = 0;
let verseIndex = 0;

const songCard = document.querySelector(".songCard");
const songTitle = document.getElementById("songTitle");
const verseCounter = document.getElementById("verseCounter");
const verseText = document.getElementById("verseText");
const songInfo = document.getElementById("songInfo");
const songProgress = document.getElementById("songProgress");

function renderVerse(){
 const song = songs[songIndex];
 songTitle.textContent = song.title;
 verseCounter.textContent = `Strophe ${verseIndex + 1} von ${song.verses.length}`;
 verseText.textContent = song.verses[verseIndex];
 songInfo.textContent = `Lied ${songIndex + 1} von ${songs.length}`;
 songProgress.textContent = songs.map((song, index) => index === songIndex ? "★" : "☆").join(" ");
 songCard.scrollTop = 0;
}

function previousVerse(){
 if(verseIndex > 0){
  verseIndex--;
 }else{
  songIndex = (songIndex - 1 + songs.length) % songs.length;
  verseIndex = songs[songIndex].verses.length - 1;
 }
 renderVerse();
}

function nextVerse(){
 if(verseIndex < songs[songIndex].verses.length - 1){
  verseIndex++;
 }else{
  songIndex = (songIndex + 1) % songs.length;
  verseIndex = 0;
 }
 renderVerse();
}

function changeFont(delta){
 const currentSize = parseFloat(getComputedStyle(verseText).fontSize);
 const fontSize = Math.min(48, Math.max(18, currentSize + delta));
 verseText.style.fontSize = `${fontSize}px`;
}

let touchStart = null;

songCard.addEventListener("touchstart", event => {
 if(event.touches.length !== 1){
  touchStart = null;
  return;
 }
 const touch = event.touches[0];
 touchStart = {x:touch.clientX, y:touch.clientY};
}, {passive:true});

songCard.addEventListener("touchend", event => {
 if(!touchStart){
  return;
 }
 const touch = event.changedTouches[0];
 const deltaX = touch.clientX - touchStart.x;
 const deltaY = touch.clientY - touchStart.y;
 touchStart = null;
 if(Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY)){
  return;
 }
 if(deltaX < 0){
  nextVerse();
 }else{
  previousVerse();
 }
}, {passive:true});

songCard.addEventListener("touchcancel", () => {
 touchStart = null;
}, {passive:true});

renderVerse();

</script>

</body>
</html>
