<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Kita Sonnenwinkel | Laternenumzug 2026</title>

<style>

:root{
 --bg1:#08152e;
 --bg2:#14305f;
 --gold:#ffd76a;
 --orange:#ff9d3f;
 --red:#ff6d43;
 --paper:rgba(255,248,230,.92);
 --text:#263248;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,
body{
 width:100%;
 height:100%;
 font-family:
 "Segoe UI",
 Arial,
 sans-serif;
 overflow:hidden;
}

body{
 background:
 radial-gradient(
  circle at top,
  #234d8d 0%,
  var(--bg2) 40%,
  var(--bg1) 100%);
 color:white;
}

#sky{
 position:fixed;
 inset:0;
 overflow:hidden;
 pointer-events:none;
 z-index:1;
}

.star{
 position:absolute;
 width:3px;
 height:3px;
 background:white;
 border-radius:50%;
 animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
 from{opacity:.2}
 to{opacity:1}
}

.lantern{
 position:absolute;
 width:44px;
 height:60px;
 border-radius:8px;

 background:
 linear-gradient(
 to bottom,
 #fff0ad,
 #ffc44c,
 #ff942b);

 box-shadow:
 0 0 20px #ffd84e,
 0 0 35px #ffb300;

 animation:
 lanternFloat linear infinite;
}

.lantern::before{
 content:"";
 position:absolute;
 width:20px;
 height:12px;
 left:10px;
 top:-10px;

 border:3px solid #ddd;
 border-bottom:none;
 border-radius:10px 10px 0 0;
}

@keyframes lanternFloat{

 from{
  transform:
   translateY(110vh)
   rotate(-3deg);
 }

 to{
  transform:
   translateY(-150px)
   rotate(3deg);
 }
}

.app{
 position:relative;
 z-index:2;
 height:100vh;
 display:flex;
 flex-direction:column;
}

header{
 text-align:center;
 padding:18px 10px 10px;
}

header h1{
 font-size:
 clamp(1.5rem,5vw,2.2rem);
}

header p{
 opacity:.9;
 margin-top:4px;
}

.songCard{

 flex:1;

 margin:10px;

 background:var(--paper);

 color:var(--text);

 border-radius:28px;

 overflow:auto;

 padding:24px;

 box-shadow:
 0 10px 30px rgba(0,0,0,.35);

 background-image:
 radial-gradient(
 rgba(255,184,90,.15) 1px,
 transparent 1px);

 background-size:
 12px 12px;
}

.songTitle{
 text-align:center;
 color:#be6500;
 margin-bottom:14px;

 font-size:
 clamp(1.8rem,5vw,2.5rem);
}

.verseCounter{
 text-align:center;
 margin-bottom:18px;
 color:#7b4e00;
 font-weight:600;
}

.verse{

 min-height:40vh;

 display:flex;
 align-items:center;
 justify-content:center;

 text-align:center;

 background:
 linear-gradient(
 135deg,
 rgba(255,255,255,.8),
 rgba(255,235,180,.7));

 border-radius:22px;

 padding:22px;
}

.verseText{

 white-space:pre-line;

 line-height:1.7;

 font-size:
 clamp(1.4rem,4vw,2rem);
}

.controls{
 display:grid;
 grid-template-columns:
 1fr auto 1fr;

 gap:8px;

 padding:10px;
}

button{

 border:none;

 border-radius:16px;

 padding:15px;

 font-size:1rem;

 font-weight:700;

 color:white;

 background:
 linear-gradient(
 135deg,
 var(--orange),
 var(--red));

 cursor:pointer;
}
button:active{
 transform:scale(.98);
}

.centerButtons{
 display:flex;
 gap:8px;
 justify-content:center;
}

.footerInfo{
 text-align:center;
 padding:0 10px 12px;
 font-size:.95rem;
 opacity:.95;
}

.help{
 text-align:center;
 padding-bottom:10px;
 font-size:.85rem;
 opacity:.8;
}

</style>
</head>

<body>

<div id="sky"></div>

<div class="app">

<header>
<h1>🏮 Kita Sonnenwinkel</h1>
<p>Laternenumzug 2026</p>
</header>

<div class="songCard">

<h2 class="songTitle" id="songTitle"></h2>

<div class="verseCounter" id="verseCounter"></div>

<div class="verse">
<div class="verseText" id="verseText"></div>
</div>

</div>

<div class="controls">

<button onclick="previousVerse()">
← Zurück
</button>

<div class="centerButtons">

<button onclick="changeFont(2)">
A+
</button>

<button onclick="changeFont(-2)">
A-
</button>

</div>

<button onclick="nextVerse()">
Weiter →
</button>

</div>

<div class="footerInfo" id="songInfo"></div>

<div class="help">
Links/Rechts wischen oder Buttons verwenden
</div>

</div>

</body>
